{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-2xl mx-auto px-2.5 sm:px-4 py-4 sm:py-8 pb-10">

  <nav class="flex items-center gap-1.5 text-xs text-slate-500 mb-4">
    <a href="{% url 'shop:home' %}" class="hover:text-amber-600">Accueil</a>
    <span>/</span>
    <a href="{% url 'accounts:dashboard' %}" class="hover:text-amber-600">Mon compte</a>
    <span>/</span>
    <span class="text-slate-900 font-bold">Mon profil</span>
  </nav>

  <div class="bg-white rounded-2xl p-4 sm:p-6 border border-slate-200/80 shadow-sm">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
      <div>
        <h1 class="font-display font-black text-lg sm:text-xl text-slate-950">Modifier mon profil</h1>
        <p class="text-xs text-slate-500 mt-0.5">Mettez à jour vos coordonnées personnelles</p>
      </div>
      <a href="{% url 'accounts:dashboard' %}" class="text-xs font-bold text-slate-500 hover:text-slate-800">Retour</a>
    </div>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}

      <div class="flex items-center gap-4" x-data="{ photoPreview: null }">
        <div>
          <template x-if="photoPreview">
            <img :src="photoPreview" class="w-16 h-16 rounded-full object-cover border-2 border-amber-400">
          </template>
          <template x-if="!photoPreview">
            {% if profile.avatar %}
            <img src="{{ profile.avatar.url }}" alt="{{ profile.get_full_name }}" class="w-16 h-16 rounded-full object-cover border-2 border-amber-200">
            {% else %}
            <div class="w-16 h-16 rounded-full bg-amber-400 text-slate-950 flex items-center justify-center font-display font-black text-xl">
              {{ request.user.first_name|first|default:request.user.username|first|upper }}
            </div>
            {% endif %}
          </template>
        </div>

        <div class="min-w-0">
          <label class="block text-xs font-bold text-slate-700 mb-1">Photo de profil</label>
          <input
            type="file"
            name="avatar"
            accept="image/*"
            class="text-xs text-slate-500 file:mr-2.5 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-50 file:text-amber-800 cursor-pointer"
            @change="const f = $event.target.files[0]; if(f){ const r = new FileReader(); r.onload = e => photoPreview = e.target.result; r.readAsDataURL(f); }"
          >
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Prénom</label>
          <input type="text" name="first_name" value="{{ request.user.first_name }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base sm:text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nom</label>
          <input type="text" name="last_name" value="{{ request.user.last_name }}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base sm:text-sm focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Email</label>
          <input type="email" value="{{ request.user.email }}" disabled class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-slate-500 text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Téléphone (Mali)</label>
          <input type="tel" name="phone" value="{{ profile.phone }}" placeholder="+223 70 00 00 00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base sm:text-sm font-mono focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <label class="flex items-center gap-2.5 pt-1 cursor-pointer select-none">
        <input type="checkbox" name="newsletter" {% if profile.newsletter %}checked{% endif %} class="w-4 h-4 rounded border-slate-300 text-amber-500 focus:ring-amber-500">
        <span class="text-xs text-slate-700">Recevoir les alertes arrivages et offres flash</span>
      </label>

      <div class="flex items-center justify-end gap-2.5 pt-4 border-t border-slate-100">
        <a href="{% url 'accounts:dashboard' %}" class="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100">Annuler</a>
        <button type="submit" class="px-5 py-2.5 bg-amber-400 hover:bg-amber-500 text-slate-950 font-extrabold text-xs rounded-xl shadow-sm transition cursor-pointer">
          Enregistrer
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
