{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="max-w-2xl mx-auto px-2.5 sm:px-4 py-4 sm:py-8 pb-10">

  <nav class="flex items-center gap-1.5 text-xs text-slate-500 mb-4">
    <a href="{% url 'shop:home' %}" class="hover:text-amber-600">Accueil</a>
    <span>/</span>
    <a href="{% url 'accounts:dashboard' %}" class="hover:text-amber-600">Mon compte</a>
    <span>/</span>
    <span class="text-slate-900 font-bold">Nouvelle adresse</span>
  </nav>

  <div class="bg-white rounded-2xl p-4 sm:p-6 border border-slate-200/80 shadow-sm">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
      <div>
        <h1 class="font-display font-black text-lg sm:text-xl text-slate-950">Nouvelle adresse de livraison</h1>
        <p class="text-xs text-slate-500 mt-0.5">Pour vos commandes rapides à Bamako</p>
      </div>
      <a href="{% url 'accounts:dashboard' %}" class="text-xs font-bold text-slate-500 hover:text-slate-800">Annuler</a>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div class="grid sm:grid-cols-2 gap-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Nom complet du destinataire *</label>
          <input type="text" name="full_name" required placeholder="Ex: Moussa Diarra" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base sm:text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Téléphone joignable *</label>
          <input type="tel" name="phone" required placeholder="+223 70 00 00 00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base sm:text-sm font-mono focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <div class="grid sm:grid-cols-2 gap-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Ville *</label>
          <input type="text" name="city" value="Bamako" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base sm:text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Quartier / Commune</label>
          <input type="text" name="district" placeholder="Ex: ACI 2000, Badalabougou..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base sm:text-sm focus:outline-none focus:border-amber-500">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Adresse exacte &amp; repère *</label>
        <textarea name="address_line" rows="2" required placeholder="Rue, porte, repère visuel..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-base sm:text-sm focus:outline-none focus:border-amber-500"></textarea>
      </div>

      <label class="flex items-center gap-2.5 pt-1 cursor-pointer select-none">
        <input type="checkbox" name="is_default" class="w-4 h-4 rounded border-slate-300 text-amber-500 focus:ring-amber-500">
        <span class="text-xs text-slate-700 font-medium">Définir comme adresse par défaut</span>
      </label>

      <div class="flex items-center justify-end gap-2.5 pt-4 border-t border-slate-100">
        <a href="{% url 'accounts:dashboard' %}" class="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100">Annuler</a>
        <button type="submit" class="px-5 py-2.5 bg-amber-400 hover:bg-amber-500 text-slate-950 font-extrabold text-xs rounded-xl shadow-sm transition cursor-pointer">
          Enregistrer l'adresse
        </button>
      </div>
    </form>
  </div>

</div>
{% endblock %}
